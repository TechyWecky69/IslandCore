# IslandCore Skill Tree upgrade prices — v4.8
#
# This file controls the Tree Token cost, item cost, and unlock prerequisites
# for every skill-tree node.
#
# ─── Token / item costs ──────────────────────────────────────────────────────
# Material names are Bukkit/Spigot Material names (e.g. OAK_LOG).
# Set tokens to 0 and remove all items if an upgrade should be free.
#
# ─── Prerequisites ───────────────────────────────────────────────────────────
# Each node can require other nodes to be unlocked first via the `requires`
# list. The player will see the missing nodes listed in the GUI and chat.
# Remove or leave the list empty to make a node freely accessible.
#
# Default logic (feel free to change):
#  • Within a category, each tier requires the previous tier.
#  • Higher-risk categories (Nether, End) require some Mining progress first.
#  • Fishing requires mid-level farming (food / bait) before it unlocks.
#  • Enchanting T2/T3 require the previous enchanting tier.
#  • Biome nodes have no cross-category requires (they're self-contained).
# ─────────────────────────────────────────────────────────────────────────────

nodes:
  start:
    tokens: 0
    items: {}
    requires: []

  # ── MINING ──────────────────────────────────────────────────────────────────
  mining1:
    tokens: 5
    items:
      OAK_LOG: 32
      DIRT: 16
    requires: []           # Always available — the gateway into mining

  mining2:
    tokens: 15
    items:
      COBBLESTONE: 32
      COAL: 16
    requires:
      - mining1            # Must have Cave Opening first

  mining3:
    tokens: 30
    items:
      IRON_ORE: 32
      REDSTONE: 16
    requires:
      - mining2            # Must have Deep Caverns first

  # ── END ─────────────────────────────────────────────────────────────────────
  end1:
    tokens: 50
    items:
      OBSIDIAN: 16
      ENDER_PEARL: 8
    requires:
      - mining2            # Need solid mining before entering the End

  end2:
    tokens: 80
    items:
      END_STONE: 32
      DIAMOND: 8
    requires:
      - end1               # Must unlock End Island first
      - mining3            # And have the deepest mining tier

  # ── NETHER ──────────────────────────────────────────────────────────────────
  nether1:
    tokens: 50
    items:
      OBSIDIAN: 32
      COBBLESTONE: 32
    requires:
      - mining2            # Need iron-level mining to craft the portal

  nether2:
    tokens: 70
    items:
      NETHERRACK: 32
      NETHER_BRICKS: 16
    requires:
      - nether1            # Must have Wastelands first
      - mining3            # Deep mining prep for ancient debris

  # ── FARMING ─────────────────────────────────────────────────────────────────
  farming1:
    tokens: 10
    items:
      DIRT: 32
      WHEAT_SEEDS: 16
    requires: []           # Freely unlockable at any time

  farming2:
    tokens: 20
    items:
      WHEAT: 64
      WHEAT_SEEDS: 32
    requires:
      - farming1           # Must be an Island Farmer first

  farming3:
    tokens: 25
    items:
      MELON_SLICE: 32
      PUMPKIN: 32
    requires:
      - farming2           # Professional before Slaughterhouse

  # ── FISHING ─────────────────────────────────────────────────────────────────
  fishing:
    tokens: 10
    items:
      CARROT: 32
      SUGAR_CANE: 16
    requires:
      - farming2           # Need a working farm for bait/food before the dock

  # ── FLOWERS ─────────────────────────────────────────────────────────────────
  flowers1:
    tokens: 10
    items: {}
    requires: []           # Freely available — starter decoration

  flowers2:
    tokens: 20
    items: {}
    requires:
      - flowers1           # Basic flowers before the full Bouquet

  # ── BIOME ───────────────────────────────────────────────────────────────────
  biome:
    tokens: 20
    items:
      COBBLESTONE: 32
      OAK_LOG: 16
    requires: []           # Always unlockable

  # ── COLOUR ──────────────────────────────────────────────────────────────────
  colour:
    tokens: 30
    items:
      CLAY: 32
      COBBLESTONE: 16
    requires:
      - farming1           # Clay comes from farming/landscape work

  # ── ENCHANTING ──────────────────────────────────────────────────────────────
  enchanting1:
    tokens: 40
    items:
      DIAMOND: 16
      LAPIS_LAZULI: 32
    requires:
      - mining2            # Lapis and diamonds need real mining progress

  enchanting2:
    tokens: 55
    items:
      LAPIS_LAZULI: 32
      EXPERIENCE_BOTTLE: 16
    requires:
      - enchanting1        # Must reach Amateur Magic first

  enchanting3:
    tokens: 75
    items:
      ENCHANTED_BOOK: 8
      EXPERIENCE_BOTTLE: 16
    requires:
      - enchanting2        # Must be a Wizard before becoming a Sorcerer
      - mining3            # Deepest materials for top-tier enchantments

  # ── BREWING ─────────────────────────────────────────────────────────────────
  brewing:
    tokens: 15
    items:
      BLAZE_ROD: 8
      GLASS_BOTTLE: 8
    requires:
      - nether1            # Blaze rods come from the Nether

  # ── BIOME UNLOCKS ───────────────────────────────────────────────────────────
  # Biome nodes chain through the wood-family progression.
  # They don't require other skill categories — just the previous biome tier.
  biomes:
    oak:
      tokens: 0
      items: {}
      requires: []

    birch:
      tokens: 8
      items:
        OAK_LOG: 32
        OAK_SAPLING: 16
      requires:
        - oak              # Must have Oak first

    dark_oak:
      tokens: 10
      items:
        BIRCH_LOG: 32
      requires:
        - birch

    spruce:
      tokens: 10
      items:
        DARK_OAK_LOG: 32
      requires:
        - dark_oak

    jungle:
      tokens: 15
      items:
        SPRUCE_LOG: 32
        OAK_LEAVES: 32
      requires:
        - spruce

    acacia:
      tokens: 15
      items:
        JUNGLE_LOG: 32
      requires:
        - jungle

    mangrove:
      tokens: 20
      items:
        ACACIA_LOG: 32
        MUD: 16
      requires:
        - acacia

    cherry:
      tokens: 25
      items:
        MANGROVE_LOG: 32
        MANGROVE_LEAVES: 16
      requires:
        - mangrove

    crimson:
      tokens: 20
      items:
        NETHERRACK: 32
      requires: []         # Nether biomes are independent of forest biomes

    warped:
      tokens: 20
      items:
        CRIMSON_STEM: 32
      requires:
        - crimson

    basalt:
      tokens: 30
      items:
        BASALT: 64
        BLACKSTONE: 32
      requires:
        - warped
